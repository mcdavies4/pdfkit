name: Pinterest — Auto-pin New Articles

on:
  workflow_run:
    workflows: ["Daily Blog Articles"]
    types: [completed]
    branches: [main]

jobs:
  pin:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new blog article
        id: article
        run: |
          NEW_FILE=$(git diff --name-only HEAD~1 HEAD -- 'blog/*.html' | grep -v 'blog/index.html' | head -1 || true)
          if [ -z "$NEW_FILE" ]; then
            echo "No new article found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            SLUG=$(basename "$NEW_FILE" .html)
            URL="https://rightpdfkit.com/blog/$SLUG"
            TITLE=$(grep -o '<title>[^<]*</title>' "$NEW_FILE" | sed 's/<title>//;s/ | RightPDFKit<\/title>//' | head -1)
            DESC=$(grep -o 'content="[^"]*"' "$NEW_FILE" | grep -A1 'name="description"' | head -2 | tail -1 | sed 's/content="//;s/"//')
            echo "found=true" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "desc=$DESC" >> $GITHUB_OUTPUT
          fi

      - name: Create Pinterest pin
        if: steps.article.outputs.found == 'true'
        run: |
          RESPONSE=$(curl -s "https://api.pinterest.com/v5/boards" \
            -H "Authorization: Bearer ${{ secrets.PINTEREST_ACCESS_TOKEN }}")
          BOARD_ID=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          boards = data.get('items', [])
          for b in boards:
              if 'pdf-tips' in b.get('name','').lower() or 'pdf' in b.get('name','').lower():
                  print(b['id'])
                  break
          else:
              if boards:
                  print(boards[0]['id'])
          ")
          echo "Board ID: $BOARD_ID"
          curl -s -X POST "https://api.pinterest.com/v5/pins" \
            -H "Authorization: Bearer ${{ secrets.PINTEREST_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"board_id\": \"$BOARD_ID\",
              \"title\": \"${{ steps.article.outputs.title }}\",
              \"description\": \"${{ steps.article.outputs.desc }} Free, no upload, works in your browser.\",
              \"link\": \"${{ steps.article.outputs.url }}\",
              \"media_source\": {
                \"source_type\": \"image_url\",
                \"url\": \"https://rightpdfkit.com/og-image.png?v=52\"
              }
            }"
          echo "Pinned: ${{ steps.article.outputs.title }}"
