name: LinkedIn — Auto-post New Articles

on:
  workflow_run:
    workflows: ["Daily Blog Articles"]
    types: [completed]
    branches: [main]

jobs:
  post:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new blog article
        id: article
        run: |
          NEW_FILE=$(git diff --name-only HEAD~1 HEAD -- 'blog/*.html' | grep -v 'blog/index.html' | head -1 || true)
          if [ -z "$NEW_FILE" ]; then
            echo "No new article found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            SLUG=$(basename "$NEW_FILE" .html)
            URL="https://rightpdfkit.com/blog/$SLUG"
            TITLE=$(grep -o '<title>[^<]*</title>' "$NEW_FILE" | sed 's/<title>//;s/ | RightPDFKit<\/title>//' | head -1)
            DESC=$(grep -o 'content="[^"]*"' "$NEW_FILE" | grep -A1 'name="description"' | head -2 | tail -1 | sed 's/content="//;s/"//' | cut -c1-200)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "desc=$DESC" >> $GITHUB_OUTPUT
          fi

      - name: Post to LinkedIn
        if: steps.article.outputs.found == 'true'
        run: |
          TOKEN="${{ secrets.LINKEDIN_ACCESS_TOKEN }}"

          PROFILE=$(curl -s "https://api.linkedin.com/v2/userinfo" \
            -H "Authorization: Bearer $TOKEN")
          PERSON_ID=$(echo "$PROFILE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sub',''))" 2>/dev/null || echo "")

          if [ -z "$PERSON_ID" ]; then
            PROFILE2=$(curl -s "https://api.linkedin.com/v2/me" \
              -H "Authorization: Bearer $TOKEN")
            PERSON_ID=$(echo "$PROFILE2" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          fi

          echo "Person ID: $PERSON_ID"

          TITLE="${{ steps.article.outputs.title }}"
          URL="${{ steps.article.outputs.url }}"
          DESC="${{ steps.article.outputs.desc }}"
          PERSON_URN="urn:li:person:$PERSON_ID"

          TEXT="$TITLE

$DESC Free, no upload, works in your browser.

$URL

#PDF #FreeTool #Productivity #Tech"

          curl -s -X POST "https://api.linkedin.com/v2/ugcPosts" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -d "{
              \"author\": \"$PERSON_URN\",
              \"lifecycleState\": \"PUBLISHED\",
              \"specificContent\": {
                \"com.linkedin.ugc.ShareContent\": {
                  \"shareCommentary\": {\"text\": $(echo "$TEXT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")},
                  \"shareMediaCategory\": \"ARTICLE\",
                  \"media\": [{
                    \"status\": \"READY\",
                    \"originalUrl\": \"$URL\",
                    \"title\": {\"text\": $(echo "$TITLE" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")},
                    \"description\": {\"text\": $(echo "$DESC" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")}
                  }]
                }
              },
              \"visibility\": {
                \"com.linkedin.ugc.MemberNetworkVisibility\": \"PUBLIC\"
              }
            }"
          echo "Posted to LinkedIn: $TITLE"