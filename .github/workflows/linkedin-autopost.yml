name: LinkedIn — Auto-post New Articles

on:
  workflow_run:
    workflows: ["Daily Blog Articles"]
    types: [completed]
    branches: [main]

jobs:
  post:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new blog article
        id: article
        run: |
          NEW_FILE=$(git diff --name-only HEAD~1 HEAD -- 'blog/*.html' | grep -v 'blog/index.html' | head -1 || true)
          if [ -z "$NEW_FILE" ]; then
            echo "No new article found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            SLUG=$(basename "$NEW_FILE" .html)
            URL="https://rightpdfkit.com/blog/$SLUG"
            TITLE=$(grep -o '<title>[^<]*</title>' "$NEW_FILE" | sed 's/<title>//;s/ | RightPDFKit<\/title>//' | head -1)
            DESC=$(grep -o 'content="[^"]*"' "$NEW_FILE" | grep -A1 'name="description"' | head -2 | tail -1 | sed 's/content="//;s/"//' | cut -c1-200)
            echo "found=true" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "desc=$DESC" >> $GITHUB_OUTPUT
          fi

      - name: Post to LinkedIn
        if: steps.article.outputs.found == 'true'
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error

          token = os.environ['LINKEDIN_ACCESS_TOKEN']
          title = os.environ['ARTICLE_TITLE']
          url = os.environ['ARTICLE_URL']
          desc = os.environ['ARTICLE_DESC']

          # Get person URN
          req = urllib.request.Request(
            'https://api.linkedin.com/v2/userinfo',
            headers={'Authorization': f'Bearer {token}'}
          )
          try:
            with urllib.request.urlopen(req) as r:
              profile = json.loads(r.read())
              person_urn = f"urn:li:person:{profile['sub']}"
          except Exception as e:
            print(f"userinfo failed: {e}, trying /v2/me")
            req2 = urllib.request.Request(
              'https://api.linkedin.com/v2/me',
              headers={'Authorization': f'Bearer {token}'}
            )
            with urllib.request.urlopen(req2) as r:
              profile = json.loads(r.read())
              person_urn = f"urn:li:person:{profile['id']}"

          print(f"Posting as: {person_urn}")

          post_body = {
            "author": person_urn,
            "lifecycleState": "PUBLISHED",
            "specificContent": {
              "com.linkedin.ugc.ShareContent": {
                "shareCommentary": {
                  "text": f"{title}\n\n{desc}\n\nFree, no upload, works in your browser.\n\n{url}\n\n#PDF #FreeTool #Productivity #Tech"
                },
                "shareMediaCategory": "ARTICLE",
                "media": [{
                  "status": "READY",
                  "originalUrl": url,
                  "title": {"text": title},
                  "description": {"text": desc}
                }]
              }
            },
            "visibility": {
              "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
            }
          }

          data = json.dumps(post_body).encode('utf-8')
          req3 = urllib.request.Request(
            'https://api.linkedin.com/v2/ugcPosts',
            data=data,
            headers={
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'X-Restli-Protocol-Version': '2.0.0'
            },
            method='POST'
          )
          with urllib.request.urlopen(req3) as r:
            result = json.loads(r.read())
            print(f"Posted: {result}")
          EOF
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          ARTICLE_TITLE: ${{ steps.article.outputs.title }}
          ARTICLE_URL: ${{ steps.article.outputs.url }}
          ARTICLE_DESC: ${{ steps.article.outputs.desc }}
